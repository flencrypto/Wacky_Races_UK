version: '3.9'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: wackraces
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d wackraces"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    profiles: ["prod"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      PORT: "3000"
      NODE_ENV: ${NODE_ENV}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  processor:
    build: ./processor
    profiles: ["prod"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}

  web:
    build: ./web
    profiles: ["prod"]
    depends_on:
      - api
    expose:
      - "80"

  nginx:
    image: nginx:1.27-alpine
    profiles: ["prod"]
    depends_on:
      - web
      - api
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  agents:
    build: ./agents
    profiles: ["prod"]
    depends_on:
      - api
    environment:
      AGENTS_API_BASE_URL: ${AGENTS_API_BASE_URL}
      AGENTS_STATUS_PORT: "4000"
      AGENTS_OPS_INTERVAL_MS: ${AGENTS_OPS_INTERVAL_MS}
      AGENTS_HEARTBEAT_INTERVAL_MS: ${AGENTS_HEARTBEAT_INTERVAL_MS}
      AGENTS_HEARTBEAT_TIMEOUT_SEC: ${AGENTS_HEARTBEAT_TIMEOUT_SEC}
    ports:
      - "4000:4000"

volumes:
  pgdata:
  redisdata:

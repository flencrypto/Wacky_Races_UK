worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=100r/s;

    # Map upgrade header for WebSocket proxying
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Upstream blocks
    upstream api {
        server api:3000;
    }

    upstream web {
        server web:80;
    }

    # Gzip settings
    gzip on;
    gzip_types text/html application/json text/css application/javascript;

    server {
        listen 80;

        # WebSocket endpoint
        location /v1/ws {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Upgrade $http_upgrade;
            proxy_read_timeout 3600s;
            limit_req zone=ws_limit burst=200 nodelay;
        }

        # API endpoints
        location /v1/ {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            limit_req zone=api_limit burst=20 nodelay;
        }

        # Tile endpoints
        location /tiles/ {
            proxy_pass http://api;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=86400";
        }

        # Frontend (default)
        location / {
            proxy_pass http://web;
            proxy_set_header Host $host;
        }
    }
}
